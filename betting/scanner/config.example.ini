; Copy this file to config.ini and fill in the two Betfair values.
; config.ini stays on your laptop: it is ignored by git and is never uploaded.
; Your password is NOT stored here - the scanner asks for it each time.

[betfair]
username = your_betfair_username
app_key = your_DELAYED_app_key
; Optional: folder holding client-2048.crt and client-2048.key for certificate login.
; Leave blank to use normal username/password login.
certs_folder =

[rules]
min_price = 1.65
value_threshold = 1.15
commission = 0.05
gap_warning_points = 15
; Trust in the market price vs the model when judging value (0 = model only, 1 = market only)
market_weight = 0.7
shrink = 0.75
home_advantage = 1.10

[files]
teams_csv = teams.csv
